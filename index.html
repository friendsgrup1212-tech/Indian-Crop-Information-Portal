<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiVigyan - Complete Crop Encyclopedia</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <div class="logo">
                <h1>🌱 KrishiVigyan <span id="sub-title">| कृषि विज्ञान</span></h1>
            </div>
            <button id="lang-toggle" class="lang-btn" onclick="toggleLanguage()">
                Switch to English
            </button>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2 id="hero-heading">सभी प्रमुख फसलों की संपूर्ण वैज्ञानिक जानकारी</h2>
            <p id="hero-desc">वानस्पतिक नाम, रोग, कीट, जलवायु, तापमान, किस्में, उत्पत्ति स्थान और गुणसूत्र संख्या</p>
            
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="filterCrops()" placeholder="फसल का नाम खोजें (जैसे: धान, Wheat, आम)...">
            </div>
        </div>
    </section>

    <div class="container">
        <div class="category-tabs" id="categoryTabs">
            <button class="tab-btn active" onclick="filterCategory('all')" data-hi="सभी फसलें" data-en="All Crops">सभी फसलें</button>
            <button class="tab-btn" onclick="filterCategory('cereal')" data-hi="खाद्यान्न फसलें" data-en="Cereal Crops">खाद्यान्न फसलें</button>
            <button class="tab-btn" onclick="filterCategory('pulse')" data-hi="दलहनी फसलें" data-en="Pulse Crops">दलहनी फसलें</button>
            <button class="tab-btn" onclick="filterCategory('oilseed')" data-hi="तिलहनी फसलें" data-en="Oilseed Crops">तिलहनी फसलें</button>
            <button class="tab-btn" onclick="filterCategory('commercial')" data-hi="व्यावसायिक फसलें" data-en="Commercial Crops">व्यावसायिक फसलें</button>
            <button class="tab-btn" onclick="filterCategory('medicinal')" data-hi="औषधीय फसलें" data-en="Medicinal Crops">औषधीय फसलें</button>
            <button class="tab-btn" onclick="filterCategory('horticulture')" data-hi="बागवानी फसलें" data-en="Horticulture Crops">बागवानी फसलें</button>
        </div>

        <main id="cropsContainer" class="crops-grid">
            <!-- Crop cards JavaScript se yahan load honge -->
        </main>
    </div>

    <footer>
        <p id="footer-text">© 2026 KrishiVigyan Portal | कृषि छात्रों एवं किसानों के लिए समर्पित</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
